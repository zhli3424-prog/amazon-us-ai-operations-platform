<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 跨境智营台</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/operations.css') }}">
</head>
<body class="login-body"><main class="login-card"><h1>跨境智营台</h1><p>请使用运营账号登录</p>{% if error %}<div class="login-error">{{ '失败次数过多，请 15 分钟后再试' if error == 'locked' else '动态验证码或恢复码错误' if error == 'otp' else '用户名或密码错误' }}</div>{% endif %}<form method="post" action="/login"><label>用户名</label><input name="username" autocomplete="username" required autofocus><label>密码</label><input name="password" type="password" autocomplete="current-password" required><label>动态验证码或一次性恢复码</label><input name="otp" autocomplete="one-time-code" maxlength="20"><button>安全登录</button></form><small>演示环境初始账号由环境变量 ADMIN_USERNAME 和 ADMIN_PASSWORD 配置。生产环境必须更换强密码并启用 MFA。</small></main></body>
</html>
