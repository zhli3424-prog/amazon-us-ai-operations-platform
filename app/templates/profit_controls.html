<section class="panel"><div class="panel-head"><div><h2>成本口径与数据来源</h2><p>费率使用 0–1 小数，例如 15% 填 0.15。更新后只影响估算口径，不改写已同步结算流水。</p></div></div><div class="cost-profile-list">{% for p in products %}<details><summary><b>{{ p.sku }}</b> · {{ p.economics.data_source }}{% if p.economics.transaction_count %} · {{ p.economics.transaction_count }} 条流水{% endif %}</summary><form class="api-form cost-profile" action="/api/products/{{ p.id }}/cost-profile"><label>佣金率<input type="number" min="0" max="1" step="0.001" name="referral_rate" value="{{ p.cost_profile.referral_rate }}" required></label><label>FBA/件<input type="number" min="0" step="0.01" name="fba_fee_per_unit" value="{{ p.cost_profile.fba_fee_per_unit }}" required></label><label>头程/件<input type="number" min="0" step="0.01" name="inbound_cost_per_unit" value="{{ p.cost_profile.inbound_cost_per_unit }}" required></label><label>广告费率<input type="number" min="0" max="1" step="0.001" name="ad_rate" value="{{ p.cost_profile.ad_rate }}" required></label><label>其他成本/件<input type="number" min="0" step="0.01" name="other_cost_per_unit" value="{{ p.cost_profile.other_cost_per_unit }}" required></label><label>生效日期<input type="date" name="effective_from" value="{{ p.cost_profile.effective_from[:10] }}" required></label><button>保存费率</button></form></details>{% endfor %}</div></section>
